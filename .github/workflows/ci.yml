name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Бэкенд — тесты (SQLite и PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest (SQLite)
        run: pytest -q
      - name: pytest (PostgreSQL)
        env:
          FLORAPLAN_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: pytest -q

  frontend:
    name: Интерфейс — проверка типов и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: static
          path: backend/floraplan/static

  e2e:
    name: Сквозные тесты интерфейса (Playwright)
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/download-artifact@v8
        with:
          name: static
          path: backend/floraplan/static
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests_e2e

  docker:
    name: Docker-образы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose build
        env:
          DB_PASSWORD: ci
          SECRET_KEY: ci
        run: docker compose -f deploy/docker-compose.yml build
      - name: Запуск и проверка /api/health через nginx
        env:
          DB_PASSWORD: ci
          SECRET_KEY: ci
        run: |
          docker compose -f deploy/docker-compose.yml up -d
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/health && exit 0; sleep 3; done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: HTTPS через прокси Caddy (Б-1)
        env:
          DB_PASSWORD: ci
          SECRET_KEY: ci
          DOMAIN: localhost
        run: |
          docker compose -f deploy/docker-compose.yml --profile https up -d
          for i in $(seq 1 40); do curl -fsk https://localhost/api/health && exit 0; sleep 3; done
          docker compose -f deploy/docker-compose.yml --profile https logs proxy
          exit 1
      - name: Резервная копия и восстановление PostgreSQL в контейнере (Н-1)
        env:
          DB_PASSWORD: ci
          SECRET_KEY: ci
        run: |
          c="docker compose -f deploy/docker-compose.yml"
          $c exec -T api floraplan backup
          name=$($c exec -T api sh -c 'ls -t /data/backup | head -1')
          $c stop api scheduler
          $c run --rm -T api floraplan restore "$name" --yes
          $c start api scheduler
          for i in $(seq 1 40); do curl -fs http://localhost:8080/api/health && exit 0; sleep 3; done
          exit 1
