name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  windows:
    name: Windows-сборка (без установки)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Интерфейс
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: PyInstaller
        working-directory: backend
        run: |
          pip install . pyinstaller==6.11.1
          pyinstaller --noconfirm --distpath ../release/dist --workpath ../release/build ../packaging/windows/floraplan.spec
      - name: Проверка сборки
        working-directory: release/dist/FloraPlan
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          & ".\ФлораПлан.exe" init-db
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item -Recurse -Force data
      - name: Архив
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Copy-Item packaging/windows/README.txt release/dist/FloraPlan/
          Copy-Item LICENSE release/dist/FloraPlan/LICENSE.txt
          Compress-Archive -Path release/dist/FloraPlan -DestinationPath "release/FloraPlan-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*.zip

  images:
    name: Docker-образы в GHCR
    runs-on: ubuntu-latest
    continue-on-error: true   # дополнительный способ поставки; релиз выходит и без него
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Сборка и публикация
        env:
          DB_PASSWORD: x
          SECRET_KEY: x
        run: |
          prefix=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          tag="${GITHUB_REF_NAME#v}"
          IMAGE_PREFIX=$prefix TAG=$tag docker compose -f deploy/docker-compose.yml build
          for s in backend web; do
            docker push $prefix/$s:$tag
            docker tag $prefix/$s:$tag $prefix/$s:latest
            docker push $prefix/$s:latest
          done

  release:
    name: Релиз на GitHub
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          name: ФлораПлан ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: dist/*.zip
