[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floraplan"
version = "1.2.0"
description = "ФлораПлан — информационная система планирования закупок и продаж цветочной продукции"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic-settings==2.6.1",
    "pyjwt==2.10.1",
    "statsmodels==0.14.4",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "openpyxl==3.1.5",
    "apscheduler==3.11.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.3",
    "python-multipart==0.0.19",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "playwright==1.49.0"]

[project.scripts]
floraplan = "floraplan.cli:main"

[tool.setuptools.packages.find]
include = ["floraplan*"]

[tool.setuptools.package-data]
floraplan = ["migrations/*.ini", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
